name: Release

# Runs when a version tag is pushed, e.g. v9.0.0.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          dotnet build EdiWeave.sln -c Release -p:Version=$VERSION
          dotnet test EdiWeave.sln -c Release --no-build

      - name: Pack
        run: |
          for p in src/EdiWeave.Core/EdiWeave.Core.csproj \
                   src/EdiWeave.Framework/EdiWeave.Framework.csproj \
                   src/EdiWeave.Hipaa835/EdiWeave.Hipaa835.csproj \
                   src/EdiWeave.Healthcare/EdiWeave.Healthcare.csproj \
                   rules/Rules.Hipaa005010/Rules.Hipaa005010.csproj \
                   rules/Rules.Hipaa004010/Rules.Hipaa004010.csproj; do
            dotnet pack "$p" -c Release --no-build -p:Version=$VERSION -o artifacts
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --title "EdiWeave.Next $VERSION" --generate-notes

      # Publishes to nuget.org only when the NUGET_API_KEY repository secret is set.
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        if: ${{ env.NUGET_API_KEY != '' }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
